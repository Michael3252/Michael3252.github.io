:root{--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  --sky:#a9c9e8;--sky-t:#1f3d5c;
  --b1:#ffffff;--b2:#f4f4f5;--b3:#e4e4e7;--bc:#18181b;--main:#e96b56;
  --red:#dc2626;--blue:#4d8fd5;--green:#16a34a;--amber:#f59e0b;--purple:#9333ea;--violet:#7c3aed;--pri:#4f46e5;--cyan:#0891b2;
  --ok-b:#86efac;--ok-bg:#f0fdf4;--ok-t:#15803d;--ip-b:#93c5fd;--ip-bg:#eff6ff;--ip-t:#1d4ed8;
  --dr-b:#fcd34d;--dr-bg:#fffbeb;--dr-t:#b45309;--or-t:#ea580c;--eyebrow:#4b6a8a;
  color-scheme:light;
}
[data-theme=dark]{
  --sky:#3b5f86;--sky-t:#e3eefa;
  --b1:#1d232a;--b2:#262c35;--b3:#343b46;--bc:#e5e9f0;
  --red:#f87171;--blue:#60a5fa;--green:#4ade80;--amber:#fbbf24;--purple:#c084fc;--violet:#a78bfa;--pri:#818cf8;--cyan:#22d3ee;
  --ok-b:rgba(34,197,94,.5);--ok-bg:rgba(34,197,94,.15);--ok-t:#4ade80;--ip-b:rgba(59,130,246,.5);--ip-bg:rgba(59,130,246,.15);--ip-t:#60a5fa;
  --dr-b:rgba(245,158,11,.5);--dr-bg:rgba(245,158,11,.15);--dr-t:#fbbf24;--or-t:#fb923c;--eyebrow:#8fb3d9;
  color-scheme:dark;
}
:root,[data-theme]{
  --bc80:color-mix(in srgb,var(--bc) 80%,transparent);--bc70:color-mix(in srgb,var(--bc) 70%,transparent);
  --bc60:color-mix(in srgb,var(--bc) 60%,transparent);--bc50:color-mix(in srgb,var(--bc) 50%,transparent);
  --bc40:color-mix(in srgb,var(--bc) 40%,transparent);--bc30:color-mix(in srgb,var(--bc) 30%,transparent);
  --bc10:color-mix(in srgb,var(--bc) 10%,transparent);
  --b3-70:color-mix(in srgb,var(--b3) 70%,transparent);--b3-60:color-mix(in srgb,var(--b3) 60%,transparent);
  --b3-50:color-mix(in srgb,var(--b3) 50%,transparent);--b3-35:color-mix(in srgb,var(--b3) 35%,transparent);
  --main04:color-mix(in srgb,var(--main) 4%,transparent);--main06:color-mix(in srgb,var(--main) 6%,transparent);
  --main10:color-mix(in srgb,var(--main) 10%,transparent);--main15:color-mix(in srgb,var(--main) 15%,transparent);
  --main30:color-mix(in srgb,var(--main) 30%,transparent);--main50:color-mix(in srgb,var(--main) 50%,transparent);
  --shadow:0 1px 2px rgba(0,0,0,.05);--shadow-lg:0 10px 25px -5px rgba(0,0,0,.14),0 8px 10px -6px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--b1);color:var(--bc);font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled,[aria-disabled=true]{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
.s7{width:28px;height:28px}.s3{width:12px;height:12px}.s35{width:14px;height:14px}.s4{width:16px;height:16px}.s5{width:20px;height:20px}
.bold{stroke-width:2.5}
.wrap{max-width:1536px;margin:0 auto;padding:0 16px}
.muted{color:var(--bc60)}.faint{color:var(--bc30)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--bc60)}
.grow{flex:1}

/* TES header */
.tes-h{position:sticky;top:0;z-index:50;background:var(--b1)}
.tes-h .bar{display:flex;align-items:center;gap:32px;height:64px}
.logo{display:flex;align-items:center;color:var(--bc)}.logo svg{height:36px;width:auto}
.nav{display:flex;align-items:center;gap:24px}
.nav a{font-size:18px;color:color-mix(in srgb,var(--bc) 34%,transparent);position:relative;white-space:nowrap;transition:color .2s}
.nav a:hover{color:var(--bc)}.nav a.on{color:var(--bc);font-weight:600}
.hr{margin-left:auto;display:flex;align-items:center;gap:16px}
.ext{color:color-mix(in srgb,var(--bc) 38%,transparent);display:inline-flex;gap:4px;align-items:center;font-size:15px;transition:color .2s}
.ext:hover,.theme:hover{color:var(--main)}
.theme{display:flex;align-items:center;gap:8px;color:color-mix(in srgb,var(--bc) 38%,transparent);transition:color .2s}
.tgl{width:32px;height:20px;border:1.5px solid currentColor;border-radius:999px;position:relative}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:currentColor;transition:left .2s}
[data-theme=dark] .tgl::after{left:14px}
@media(max-width:900px){.nav{display:none}.ext{display:none}}

/* shared controls */
.page{padding:16px 0 56px}.page.vfit{padding-bottom:16px}
.card{border:1px solid var(--b3-70);border-radius:16px;background:var(--b1);box-shadow:var(--shadow)}
.mbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--b3-70);border-radius:12px;background:var(--b1);font-size:12px;font-weight:600;color:var(--bc70);transition:all .35s ease-out;white-space:nowrap}
.mbtn:hover{border-color:color-mix(in srgb,var(--main) 40%,transparent);background:color-mix(in srgb,var(--main) 5%,transparent);color:var(--main)}
.mbtn.on{border-color:var(--main50);background:var(--main10);color:var(--main)}
.mbtn.primary{background:var(--main);border-color:var(--main);color:#fff}
.mbtn.primary:hover{background:color-mix(in srgb,var(--main) 88%,#000);color:#fff}
.mbtn:disabled{opacity:.45;pointer-events:none}
.mbtn.full{width:100%}
.gbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:12px;font-size:12px;font-weight:600;color:var(--bc70)}
.gbtn:hover{background:var(--main10);color:var(--main)}
.cnt{border-radius:999px;background:var(--main);color:#fff;padding:0 6px;font-size:10px;font-weight:700;line-height:16px}
.input{height:32px;border:1px solid var(--b3);border-radius:12px;background:var(--b1);padding:0 10px;font-size:13px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s,background .4s}
.input:focus{border-color:var(--main);box-shadow:0 0 0 3px var(--main15)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.6}
.input[readonly]{background:var(--b2)}
.chk{accent-color:var(--main);width:14px;height:14px}
.pop{position:relative}
.panel{position:absolute;right:0;top:100%;margin-top:8px;z-index:30;border:1px solid var(--b3-70);border-radius:16px;background:var(--b1);padding:14px;box-shadow:var(--shadow-lg)}
.row-end{display:flex;justify-content:flex-end;gap:6px}
.ib{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:6px;color:var(--bc60)}
.ib:hover{background:var(--main10);color:var(--main)}
.ib.rm{color:var(--bc40);opacity:0}.ib.rm:hover{background:color-mix(in srgb,var(--red) 10%,transparent);color:var(--red)}
.rot{transition:transform .2s}.rot.on{transform:rotate(90deg)}

/* vLog top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px 16px}
.vtitle{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;min-width:0}
.vtitle h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.vtitle .sub{font-size:13px;color:var(--bc60)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.zoomseg{display:flex;gap:4px;margin-top:6px;border:1px solid var(--b3-70);border-radius:16px;padding:4px;box-shadow:var(--shadow)}
.zoomseg button{flex:1;height:28px;border-radius:12px;border-bottom:2px solid transparent;font-size:12px;font-weight:600;color:var(--bc70);transition:all .35s ease-out}
.zoomseg button:hover{color:var(--main)}
.zoomseg button.on{border-color:var(--main);background:var(--main10);color:var(--main)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--bc70)}
.li{display:inline-flex;align-items:center;gap:8px}
.sw{display:grid;place-items:center;width:28px;flex:none}

/* timeline */
/* frozen panes: the sheet (left) never scrolls sideways; only the milestone track (right) does */
.board{position:relative;margin-top:12px;display:grid;grid-template-columns:var(--lw) minmax(0,1fr);overflow:clip;--lw:184px}
@media(min-width:768px){.board{--lw:256px}}
@media(min-width:1280px){.board{--lw:288px}}
.axv{overflow:hidden;border-bottom:1px solid var(--b3-70);background:var(--b1);border-radius:0 16px 0 0}
.axv .axis{will-change:transform}
.bl{position:relative;z-index:2;contain:size;overflow-x:visible;overflow-y:clip;border-right:1px solid var(--b3-70)}
.bl-in{will-change:transform}
.br{position:relative;z-index:1;overflow:auto;max-height:calc(100dvh - 11rem - 49px);min-height:calc(22rem - 49px);overscroll-behavior:contain}
.br-in{position:relative}
.sheet-h{display:flex;border-bottom:1px solid var(--b3-70);border-right:1px solid var(--b3-70);background:var(--b1);border-radius:16px 0 0 0}
.sheet-h>div{display:flex;align-items:flex-end;padding-bottom:8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--bc60)}
.sheet-h .hc{flex:1;padding-left:42px}
.axis{position:relative;height:48px;flex:none;overflow:hidden}
.ax-top{position:absolute;top:0;height:24px;display:flex;align-items:center;padding-left:8px;border-left:1px solid var(--b3-60);font-size:12px;font-weight:700;letter-spacing:-.01em;color:var(--bc80);white-space:nowrap;overflow:hidden}
.ax-bot{position:absolute;top:24px;height:24px;display:flex;align-items:center;padding-left:4px;font-size:11px;color:var(--bc50);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}

/* ---------- one look across pages: the vLog board sets the tone ----------
   controls: soft 1px border, 12px radius, coral (--main) on hover, focus and the active tab
   states: grey = 작성 전, blue = 초안 작성 / in progress, green = 검토 완료 / done (same as the board's cells) */
.obtn{height:30px;padding:0 12px;border:1px solid var(--b3-70);border-radius:12px;color:var(--bc70);transition:all .35s ease-out}
.obtn:hover{border-color:color-mix(in srgb,var(--main) 40%,transparent);background:color-mix(in srgb,var(--main) 5%,var(--b1));color:var(--main)}
.obtn.danger{border-color:color-mix(in srgb,var(--red) 35%,transparent);color:var(--red)}
.obtn.danger:hover{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--b1));color:var(--red)}
.sbtn,.fbtn{border-radius:12px;font-size:12px;transition:all .35s ease-out}
.sbtn{background:color-mix(in srgb,var(--blue) 48%,var(--b1));color:var(--bc)}
.fbtn{border:1px solid color-mix(in srgb,var(--blue) 55%,var(--b1));color:color-mix(in srgb,var(--blue) 75%,var(--bc))}
.fbtn:hover{background:color-mix(in srgb,var(--blue) 11%,var(--b1))}
.tbtn{font-size:12px}
.da .input{border:1px solid var(--b3);border-radius:12px;background:var(--b1)}
.da .input:focus,.pvform .input:focus{border-color:var(--main);box-shadow:0 0 0 3px var(--main15)}
.da .input[readonly]{background:var(--b2);color:var(--bc60)}
.da .chk{accent-color:var(--main)}
.da select.input.req{border:1px solid var(--main50);box-shadow:0 0 0 3px var(--main10)}
.badge2{height:22px;padding:0 9px;border:0;border-radius:999px;background:var(--bc10);color:var(--bc70);font-size:11.5px;font-weight:700}
.badge2.not_started{background:var(--bc10);color:var(--bc60)}
.badge2.draft,.sst,.tcbig{background:color-mix(in srgb,var(--blue) 14%,transparent);color:color-mix(in srgb,var(--blue) 80%,var(--bc))}
.badge2.completed,.sst.ok,.tcbig.done{background:var(--ok-bg);color:var(--ok-t)}
.steps .o.on{background:color-mix(in srgb,var(--blue) 48%,var(--b1));border-color:transparent}
.steps .o.cur{border:2px solid var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.steps .ms-st.draft{color:var(--blue)}.steps .ms-st.completed{color:var(--ok-t)}.steps .ms-st.not_started{color:var(--bc50)}
.tabs2,.seg2,.graybox .seg2{gap:4px;border:1px solid var(--b3-70);border-radius:16px;background:var(--b1);padding:4px;box-shadow:var(--shadow)}
.tabs2 button,.seg2 button{border-radius:12px;border-bottom:2px solid transparent;color:var(--bc70);transition:all .35s ease-out}
.tabs2 button:hover,.seg2 button:hover{color:var(--main)}
.tabs2 button.on,.seg2 button.on{border-color:var(--main);background:var(--main10);color:var(--main);box-shadow:none}
.dcard,details.hist{border-radius:16px}
.graybox,.vlist,.pvform,.notice,.toc .grp{border-radius:12px}
.amt .more{color:var(--blue)}
/* ---------- motion: Tech lines unfold, bars fill up, what is in progress shines ---------- */
.vph{transition:transform .2s ease-out,box-shadow .2s ease-out,filter .2s ease-out}
.vph:hover{box-shadow:0 4px 10px -6px color-mix(in srgb,var(--bc) 30%,transparent);filter:saturate(1.15)}
.pc-b i,.pc-s i{position:relative;overflow:hidden}
@media (prefers-reduced-motion:no-preference){
  @keyframes row-open{from{height:0;opacity:0}to{height:44px;opacity:1}}
  @keyframes row-close{from{height:44px;opacity:1}to{height:0;opacity:0}}
  @keyframes cell-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes fill{from{transform:scaleX(0)}to{transform:none}}
  @keyframes shine{from{transform:translateX(-100%)}60%,to{transform:translateX(100%)}}
  @keyframes bar-in{from{opacity:0;transform:scaleX(.25)}to{opacity:1;transform:none}}
  @keyframes chev{from{transform:rotate(0)}to{transform:rotate(90deg)}}
  @keyframes pulse{from{box-shadow:0 0 0 0 var(--main50)}to{box-shadow:0 0 0 6px transparent}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* opening / closing a carrier: its Tech lines unfold in both panes at the same pace */
  .trow.tin{overflow:clip;animation:row-open .4s cubic-bezier(.3,.7,.2,1) both}
  .trow.tin.tin2{animation-delay:.08s}
  .trow.tout{overflow:clip;animation:row-close .22s ease-in both}
  .rot.chv{animation:chev .4s cubic-bezier(.3,.7,.2,1) both}
  /* then the cells come in from left to right and their bars fill up */
  .tin .pc{animation:cell-in .36s ease-out both;animation-delay:calc(.16s + var(--i,0)*38ms)}
  .tin .pc-b i,.tin .pc-s i.on{transform-origin:left;animation:fill .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.3s + var(--i,0)*38ms)}
  .tin .pc-s i.on:nth-child(2){animation-delay:calc(.5s + var(--i,0)*38ms)}
  /* whatever is in progress today gets a light sweeping over it */
  .pc.now .pc-b i::after,.pc.now .pc-s i.on:last-of-type::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);animation:shine 2.4s ease-in-out infinite}
  .today-pill{animation:pulse 2.4s ease-out infinite}
  /* entering a page: bars grow from the left line by line, the burndown curve draws itself */
  .intro .vph{transform-origin:left;animation:bar-in .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--r,0)*26ms)}
  .intro .sbar2{transform-origin:left;animation:bar-in .55s cubic-bezier(.2,.8,.2,1) both}
  .intro .ln-act{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .15s ease-out forwards}
  .intro .ar-act{animation:fade .9s .8s both}
  /* blocks inside a rising page only fade: two moves on top of each other read as a jump */
  .intro .dcard,.intro .da-grid .card{animation:fade .4s ease-out both}
}
/* ---------- motion, part 2: every page ----------
   Kept calm on the user's word: nothing overshoots, nothing scales or lifts on press/hover,
   a block moves once (inner parts only fade), and pop-ups animate when they appear, not on each redraw. */
.nav a::after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;background:var(--main);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.toc a{transition:background .2s,color .2s}
.tabs .ctab>a{transition:all .35s ease-out}
.theming,.theming *,.theming *::before,.theming *::after{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease,stroke .45s ease!important}
.still{animation:none!important}
.aib{position:relative;overflow:hidden}
@media (prefers-reduced-motion:no-preference){
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  @keyframes modal-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes toast-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
  @keyframes grow-x{from{transform:scaleX(0)}to{transform:none}}
  @keyframes grow-y{from{transform:scaleY(0)}to{transform:none}}
  @keyframes ring{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 45%,transparent)}to{box-shadow:0 0 0 6px transparent}}
  @keyframes pin-in{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translateX(-50%)}}
  /* pop-ups */
  .panel{animation:pop .18s ease-out both}
  .modal{animation:modal-in .24s ease-out both}
  .toast{animation:toast-in .3s ease-out both}
  #tip{animation:fade .12s ease-out}
  /* the milestone of the document in hand keeps a soft ring */
  .steps .o.cur{animation:ring 2.4s ease-out infinite}
  /* entering a page: blocks rise one after another (the board only fades: its height is measured on entry) */
  .intro>*:not(.board){animation:rise .4s ease-out both}
  .intro>*:nth-child(2):not(.board){animation-delay:.07s}.intro>*:nth-child(3):not(.board){animation-delay:.14s}
  .intro>.board{animation:fade .5s ease-out both}
  .intro .fs>*:nth-child(2){animation-delay:.08s}.intro .fs>*:nth-child(3){animation-delay:.16s}.intro .fs>*:nth-child(4){animation-delay:.24s}.intro .fs>*:nth-child(n+5){animation-delay:.32s}
  /* PLC Milestone: the line draws, the four steps fade in after it */
  .intro .steps::before{transform-origin:left;animation:grow-x .8s .25s cubic-bezier(.2,.8,.2,1) both}
  .intro .steps>div{animation:fade .4s both}
  .intro .steps>div:nth-child(1){animation-delay:.3s}.intro .steps>div:nth-child(2){animation-delay:.45s}.intro .steps>div:nth-child(3){animation-delay:.6s}.intro .steps>div:nth-child(4){animation-delay:.75s}
  /* burndown: markers and the forecast follow the curve, the right column fades in block by block */
  .intro .sbar2:nth-child(2){animation-delay:.08s}.intro .sbar2:nth-child(3){animation-delay:.16s}.intro .sbar2:nth-child(4){animation-delay:.24s}.intro .sbar2:nth-child(n+5){animation-delay:.32s}
  .intro .spin{animation:pin-in .4s .7s ease-out both}
  .intro .vl{transform-box:fill-box;transform-origin:bottom;animation:grow-y .5s 1s cubic-bezier(.2,.8,.2,1) both}
  .intro .ln-fc,.intro .ar-fc{animation:fade .7s 1.4s both}
  .intro .stats{animation:fade .4s .1s both}
  .intro .att,.intro .watch{animation:fade .4s .25s both}
  .intro .ai{animation:fade .4s .4s both}
  .intro .aib::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);animation:shine 1.6s .7s both}
}

  const start = monthStart(first - 14);

  while ((end - start) * ppd < minW) end = addMonths(end, 1);
  const x = (n) => (n - start) * ppd;
  const top = [], bot = [], major = [], minor = [];
  const months = [];
  for (let m = start; m < end; m = addMonths(m, 1)) months.push(m);
  if (zoom === 'quarters') {
    months.forEach((m, i) => {
      const mo = D(m).getUTCMonth();
      bot.push({ left: x(m), width: x(addMonths(m, 1)) - x(m), label: MON[mo] });
      minor.push(x(m));
      if (mo % 3 === 0 || i === 0) {
        const qEnd = Math.min(addMonths(m, 3 - (mo % 3)), end);
        top.push({ left: x(m), width: x(qEnd) - x(m), label: `Q${Math.floor(mo / 3) + 1} ${D(m).getUTCFullYear()}` });
        major.push(x(m));
      }
    });
  } else {
    months.forEach((m) => {
      top.push({ left: x(m), width: x(addMonths(m, 1)) - x(m), label: `${MON[D(m).getUTCMonth()]} ${D(m).getUTCFullYear()}` });
      major.push(x(m));
    });
    if (zoom === 'months') {
      for (let w = start + ((8 - D(start).getUTCDay()) % 7); w < end; w += 7) { bot.push({ left: x(w), width: 7 * ppd, label: String(D(w).getUTCDate()) }); minor.push(x(w)); }
    } else {
      for (let n = start; n < end; n++) {
        const dow = D(n).getUTCDay();
        bot.push({ left: x(n), width: ppd, label: String(D(n).getUTCDate()), we: dow === 0 || dow === 6 });
        if (dow === 1) minor.push(x(n));
      }
    }
  }
  return { start, end, ppd, width: (end - start) * ppd, top, bot, major, minor, x };
}

/** A stage name that fits the width of its bar (board and burndown). */
function stageLabel(name, w) {
  const px = (t) => t.length * 6.3;
  if (px(name) + 14 <= w) return name;
  const short = name.replace(/\s*stage$/i, '').replace(/^FVT\s*RT$/i, 'F').replace(/^Final\s*check$/i, 'FC');
  return px(short) + 10 <= w ? short : '';
}

/** Full and short name of each phase bar, in the order of phaseSpans(). */
const PHASES = [['Test Plan', 'Plan'], ['Test Case Design', 'Design'], ['Test', 'Test'], ['Test Result', 'Result'], ['Audit', 'Audit']];
function phaseLabel(full, short, w) {
  const px = (t) => [...t].reduce((n, c) => n + (c.charCodeAt(0) > 255 ? 11 : 6.3), 0);
  return px(full) + 16 <= w ? full : px(short) + 12 <= w ? short : '';
}

/* after each board render: line heights, scroll sync, wheel/touch on the sheet */
function wireBoard() {
  const rb = document.getElementById('scroller'), lv = document.getElementById('lview'), lin = document.getElementById('lin'), axin = document.getElementById('axin');
  if (!rb || !lin) return;
  ui.hov = null;
  /* fit the board to the window: page padding (16) + board border (1) below the scroller */
  rb.style.maxHeight = Math.max(260, Math.floor(innerHeight - (rb.getBoundingClientRect().top + scrollY) - 17)) + 'px';
  const right = rb.querySelectorAll('#rin > [data-ri]');
  /* lines that are unfolding (.tin) keep their CSS height: measuring them now would give 0 */
  lin.querySelectorAll(':scope > [data-ri]').forEach((el, i) => { if (right[i] && !el.classList.contains('tin')) right[i].style.height = el.offsetHeight + 'px'; });
  const sync = () => { lin.style.transform = `translateY(${-rb.scrollTop}px)`; axin.style.transform = `translateX(${-rb.scrollLeft}px)`; };
  rb.addEventListener('scroll', sync, { passive: true });
  sync();
  const scrollBy = (dy) => {
    const max = rb.scrollHeight - rb.clientHeight;
    const next = Math.max(0, Math.min(max, rb.scrollTop + dy));
    if (next === rb.scrollTop) return false;
    rb.scrollTop = next; sync(); return true;
  };
  lv.addEventListener('wheel', (e) => { if (e.deltaY && scrollBy(e.deltaY)) e.preventDefault(); }, { passive: false });
  let ty = null;
  lv.addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; }, { passive: true });
  lv.addEventListener('touchmove', (e) => { if (ty == null) return; const y = e.touches[0].clientY; if (scrollBy(ty - y)) e.preventDefault(); ty = y; }, { passive: false });
  lv.addEventListener('focusin', (e) => {
    const line = e.target.closest('[data-ri]');
    if (!line) return;
    const top = line.offsetTop, bottom = top + line.offsetHeight;
    if (top < rb.scrollTop) rb.scrollTop = top;
    else if (bottom > rb.scrollTop + rb.clientHeight) rb.scrollTop = bottom - rb.clientHeight;
    lv.scrollTop = 0; sync();
  });
}

function sstOf(id, p, r) {
  if (id.startsWith('s-')) {
    const P = planDoc(p, r);
    if (id === 's-21') return isLocked(P) ? ['확인 완료', 1] : ['추출 내용 확인 필요', 0];
    if (id === 's-31') { const hw = P.items.hw.filter((x) => !x.excluded); if (!hw.length) return ['항목 없음', 1]; const n = hw.filter((x) => x.sel && (!x.date || !String(x.risk).trim())).length; return n ? [`일정·위험 입력 필요 ${n}건`, 0] : hw.some((x) => x.sel) ? ['확인 완료', 1] : ['시험할 HW 선택 필요', 0]; }
    if (id === 's-411') { if (!P.plm.length) return ['필요 시 PLM 항목 추가', 1]; const a = P.plm.filter((x) => !x.id.trim()).length, b = P.plm.filter((x) => x.id.trim() && !x.ok).length; return a ? [`PLM ID 입력 필요 ${a}건`, 0] : b ? [`PLM 조회 필요 ${b}건`, 0] : ['확인 완료', 1]; }
    if (id === 's-521') { const n = Object.entries(P.sched).filter(([k, v]) => /[se]$/.test(k) && !String(v).trim()).length; return n ? [`일정 입력 필요 ${n}건`, 0] : ['확인 완료', 1]; }
  }
  const C = caseDoc(p, r);
  const miss = (t) => (C.und?.[t] || []).filter((x) => !String(x.reason).trim()).length;
  if (id === 'c-rtp') return splitIds(C.tpIds).length ? ['TP ID 확인', 1] : ['TP ID 입력 필요', 0];
  if (id === 'c-21') return [`Tech ${C.techs.length}개`, 1];
  if (id === 'c-22') { const n = C.techs.filter((t) => !C.spec[t]?.reviewed).length; return n ? [`검토 필요 ${n}건`, 0] : ['검토 완료', 1]; }
  if (id === 'c-231') { if (!C.und) return ['Feature 불러오기 필요', 0]; const n = C.techs.reduce((a, t) => a + miss(t), 0); return n ? [`사유 미입력 ${n}건`, 0] : ['확인 완료', 1]; }
  if (id.startsWith('und-')) { const t = id.slice(4), n = miss(t); return [`${t} · 사유 미입력 ${n}건`, !n]; }
  if (id === 'c-etp') return splitIds(C.tpF).length ? ['TP ID 확인', 1] : ['TP ID 입력 필요', 0];
  if (id === 'c-232') { if (!C.tr0) return ['Feature 불러오기 필요', 0]; const n = C.tr0.filter((x) => !String(x.reason).trim()).length; return n ? [`사유 미입력 ${n}건`, 0] : ['확인 완료', 1]; }
  if (id === 'c-24') { if (C.plm === null) return ['조회 중', 0]; const n = C.plm.filter((x) => !x.id.trim() || !String(x.cnt).trim()).length; return n ? [`입력 필요 ${n}건`, 0] : ['확인 완료', 1]; }
  return ['', 1];
}

function parse() { const h = location.hash.slice(1) || '/vlog'; const [path, qs] = h.split('?'); return { path, q: new URLSearchParams(qs || '') }; }

  if (path === '/vlog' || !['/dashboard', '/doc', '/doc/plan', '/doc/case', '/doc/result', '/doc/audit'].includes(path)) {
    wireBoard();
    requestAnimationFrame(() => scrollToDay(TODAY, false, 0.62));
  }
  if (path === '/doc/plan' || path === '/doc/case') { const { p, r } = pickRow(q); if (r && (path === '/doc/plan' || caseOpen(r))) applyLock(docOf(path === '/doc/plan' ? 'p' : 'c', p, r)); }

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('modal').innerHTML) closeModal();
    else if (ui.fc && (ui.fc.pick || ui.fc.ff)) { ui.fc.pick = false; ui.fc.ff = null; renderFc(); }
    else if (ui.menu) { ui.menu = null; renderTop(); }
    else if (ui.add) { ui.add = null; renderBoard(); }
    else if (ui.addPkg) { ui.addPkg = false; renderBoard(); }
  }
  const t = e.target;
  if (t.classList?.contains('mvb') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    const btn = t.parentElement.children[e.key === 'ArrowUp' ? 0 : 1];
    btn.click();
  }
});
document.addEventListener('pointerover', (e) => {
  const cell = e.target.closest?.('.combined .pc');
  if (!cell) return;
  [...cell.parentElement.querySelectorAll('.vph')].find((bar) => bar.style.left === cell.style.left && bar.style.width === cell.style.width)?.classList.add('hovered');
});
document.addEventListener('pointerout', (e) => {
  const cell = e.target.closest?.('.combined .pc');
  if (!cell || cell.contains(e.relatedTarget)) return;
  cell.parentElement.querySelectorAll('.vph.hovered').forEach((bar) => bar.classList.remove('hovered'));
});
document.addEventListener('pointermove', (e) => { const el = e.target.closest?.('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('scroll', (e) => {
  hideTip();
  if (ui.fc?.ff && !(e.target instanceof Element && e.target.closest('#ffp'))) { ui.fc.ff = null; renderFc(); }
}, true);
/* burndown chart hover: the day under the pointer */
document.addEventListener('pointermove', (e) => {
  const g = document.getElementById('ch-hov'), tt = document.getElementById('ch-tt');
  if (!g || !tt) return;
  const svg = e.target.closest?.('#bd-chart');
  const hide = () => { g.style.display = 'none'; tt.hidden = true; };
  if (!svg || !CH) return hide();
  const box = svg.getBoundingClientRect();
  const sx = ((e.clientX - box.left) / box.width) * CH.W;
  const day = Math.round(CH.ds + ((sx - CH.L) / CH.plotW) * (CH.de - CH.ds));
  const v = CH.pts.get(day);
  if (!v) return hide();
  const x = CH.X(day), y = CH.Y(v.v);
  const hl = document.getElementById('ch-hl'), hd = document.getElementById('ch-hd');
  hl.setAttribute('x1', x); hl.setAttribute('x2', x); hd.setAttribute('cx', x); hd.setAttribute('cy', y);
  g.style.display = '';
  tt.innerHTML = `<b>${iso(day)}</b>${v.carried ? '<div>실적 미반영 · 마지막 값 유지</div>' : ''}<div>남은 TC: ${v.v.toLocaleString()}</div><div>전일 대비: ${v.cons == null ? '—' : `${v.cons >= 0 ? '+' : '−'}${Math.abs(v.cons).toLocaleString()} TC`}</div>${v.dday != null ? `<div>${v.dday === 0 ? '예상 완료일' : `예상 완료까지 D-${v.dday}`}</div>` : ''}`;
  tt.hidden = false;
  const k = box.width / CH.W, px = x * k, py = y * k, tw = Math.min(176, box.width);
  tt.style.left = (px + 12 + tw <= box.width ? px + 12 : Math.max(0, px - tw - 12)) + 'px';
  tt.style.top = (py >= 76 ? py - 76 : py + 12) + 'px';
});
document.addEventListener('focusin', (e) => { const el = e.target.closest?.('[data-tip]'); if (el && e.target.matches(':focus-visible')) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom); } });
document.addEventListener('focusout', hideTip);
/* a pop-up panel animates when it appears, not each time its content is redrawn */
{
  let shown = new Set();
  const seen = new WeakSet();
  new MutationObserver(() => {
    const now = new Set();
    document.querySelectorAll('.panel').forEach((el) => {
      const k = [el.className.replace(' still', ''), el.id, el.dataset.form, el.dataset.pkg, el.style.width].join('|');
      now.add(k);
      if (seen.has(el)) return;
      seen.add(el);
      if (shown.has(k)) el.classList.add('still');
    });
    shown = now;
  }).observe(document.body, { childList: true, subtree: true });
}
/* a folded block (details) that the user opens: its content comes in softly */
document.addEventListener('click', (e) => {
  const d = e.target.closest?.('summary')?.parentElement;
  if (d) requestAnimationFrame(() => { if (d.open) easeIn([...d.children].filter((c) => c.tagName !== 'SUMMARY'), 'translateY(-4px)'); });
});
document.addEventListener('toggle', (e) => { const k = e.target.dataset?.k; if (k && e.target.tagName === 'DETAILS') ui.open[k] = e.target.open; }, true);
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (parse().path === '/vlog' || !location.hash) renderBoard(); }, 150); });
window.addEventListener('hashchange', () => { if (ui.modal) closeModal(true); render(); });

try { const th = localStorage.getItem('vlog-demo-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }
render();
</script>
